[package]
name = "estuda-uva"
version = "0.1.0"
description = "Acervo acadêmico local e aulas determinísticas para o Canvas UVA"
authors = ["Sierra"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "estuda_uva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "estuda-uva"
path = "src/main.rs"

[dependencies]
chromiumoxide = "=0.9.1"
futures-util = "0.3"
pdf-extract = "=0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
lopdf = { version = "=0.42.0", default-features = false }
tempfile = "3"
