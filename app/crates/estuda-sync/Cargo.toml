[package]
name = "estuda-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Motor de leitura acadêmica do Estuda UVA: política somente-leitura, vínculo, AVA/P4/provas, fetch condicional, plano de persistência e guarda de privacidade. Sem UI, sem SQLite."
publish = false

[dependencies]
estuda-domain = { path = "../../../crates/estuda-domain" }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
