[package]
name = "estuda-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Estuda UVA nativo (GPUI)"

[[bin]]
name = "estuda-uva"
path = "src/main.rs"

[dependencies]
estuda-core = { path = "../estuda-core" }
gpui-kit = "0.9.0"
espeak-rs-sys = { version = "0.2", features = ["compile-espeak-intonations"] }
rodio = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
