[package]
name = "estuda-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Núcleo do Estuda UVA: domínio acadêmico, acervo, SQLite, sincronização e Canvas/Portal (sem UI)"

[dependencies]
chromiumoxide = "=0.9.1"
docx-lite = "=0.2.0"
ego-tree = "0.10"
futures-util = "0.3"
iwork = "=0.4.0"
notify = "=8.2.0"
quick-xml = "=0.36.2"
pdf-extract = "=0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = "=0.6.6"

[dev-dependencies]
lopdf = { version = "=0.42.0", default-features = false }
tempfile = "3"
